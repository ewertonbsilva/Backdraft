name: testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python -m unittest test_dados test_backdraft test_modulos -v
      - name: Sintaxe do JavaScript
        run: for f in static/*.js; do node --check "$f"; done
      - name: Sintaxe do instalador
        run: bash -n deploy/instalar.sh
