<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Arquitetura do Backdraft">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#432328"/></marker>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a7378"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, Arial, sans-serif; fill: #2b1518; }
    .t { font-size: 22px; font-weight: 700; } .s { font-size: 15px; fill: #5f4a4f; } .m { font-size: 13px; fill: #7a6468; }
    .caixa { fill: #fff; stroke: #432328; stroke-width: 2.5; } .nucleo { fill: #fdf1f2; stroke: #DC3545; stroke-width: 3.5; }
    .ext { fill: #f6f1f2; stroke: #8a7378; stroke-width: 2; stroke-dasharray: 6 5; }
    .lin { stroke: #432328; stroke-width: 2.5; fill: none; } .lin2 { stroke: #8a7378; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
  </style>
  <rect width="1100" height="520" fill="#ffffff"/>
  <!-- navegador -->
  <rect class="caixa" x="30" y="190" width="200" height="120" rx="12"/>
  <text class="t" x="130" y="238" text-anchor="middle">Navegador</text>
  <text class="s" x="130" y="264" text-anchor="middle">equipe de TI</text>
  <text class="m" x="130" y="286" text-anchor="middle">HTML + JS (sem innerHTML)</text>
  <!-- backdraft -->
  <rect class="nucleo" x="340" y="120" width="330" height="280" rx="14"/>
  <text class="t" x="505" y="160" text-anchor="middle" fill="#DC3545" style="fill:#b52a37">Backdraft</text>
  <text class="s" x="505" y="184" text-anchor="middle">um processo Python, só a biblioteca padrão</text>
  <g class="s">
    <text x="365" y="222">• login (usuário local ou LDAPS) e sessão assinada</text>
    <text x="365" y="248">• consultas só de leitura ao índice do Wazuh</text>
    <text x="365" y="274">• prioridade: CISA KEV + EPSS</text>
    <text x="365" y="300">• plano de correção e relatório para imprimir</text>
    <text x="365" y="326">• histórico diário e avisos de críticas novas</text>
  </g>
  <text class="m" x="505" y="372" text-anchor="middle">nunca executa nada nos servidores</text>
  <!-- wazuh -->
  <rect class="caixa" x="830" y="60" width="240" height="130" rx="12"/>
  <text class="t" x="950" y="104" text-anchor="middle">Wazuh Indexer</text>
  <text class="s" x="950" y="130" text-anchor="middle">wazuh-states-vulnerabilities-*</text>
  <text class="s" x="950" y="152" text-anchor="middle">wazuh-monitoring-* (opcional)</text>
  <text class="m" x="950" y="176" text-anchor="middle">usuário somente leitura</text>
  <!-- ldap -->
  <rect class="caixa" x="830" y="225" width="240" height="100" rx="12"/>
  <text class="t" x="950" y="268" text-anchor="middle">LDAP / LDAPS</text>
  <text class="s" x="950" y="294" text-anchor="middle">opcional (1 ou 2 servidores)</text>
  <text class="m" x="950" y="314" text-anchor="middle">ou usuários locais com hash</text>
  <!-- listas -->
  <rect class="ext" x="830" y="360" width="240" height="100" rx="12"/>
  <text class="t" x="950" y="400" text-anchor="middle" style="font-size:19px">CISA KEV · FIRST EPSS</text>
  <text class="s" x="950" y="426" text-anchor="middle">listas públicas, 1 download/dia</text>
  <text class="m" x="950" y="446" text-anchor="middle">vale a última cópia se a internet cair</text>
  <!-- avisos -->
  <rect class="ext" x="340" y="440" width="330" height="60" rx="12"/>
  <text class="t" x="505" y="468" text-anchor="middle" style="font-size:19px">Telegram e/ou e-mail (SMTP)</text>
  <text class="m" x="505" y="488" text-anchor="middle">críticas novas e resumo semanal</text>
  <!-- setas -->
  <path class="lin" d="M232 250 H338" marker-end="url(#seta)"/><text class="m" x="285" y="238" text-anchor="middle">HTTPS</text>
  <path class="lin" d="M672 160 H828" marker-end="url(#seta)"/><text class="m" x="750" y="150" text-anchor="middle">HTTPS :9200</text>
  <path class="lin" d="M672 262 H828" marker-end="url(#seta)"/><text class="m" x="750" y="252" text-anchor="middle">bind LDAPS</text>
  <path class="lin2" d="M672 372 C740 372 760 400 828 405" marker-end="url(#seta2)"/>
  <path class="lin2" d="M505 402 V438" marker-end="url(#seta2)"/>
</svg>
