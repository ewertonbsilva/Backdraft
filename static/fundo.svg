<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo do login do Backdraft: chama (o nome), inseto (falha), escudo trincado, lupa (varredura) e chave (correção) -->
  <g fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

    <!-- chama -->
    <g transform="translate(240 210) rotate(-7)">
      <path d="M0 -150 C34 -92 92 -66 92 4 C92 70 48 104 0 104 C-48 104 -92 70 -92 14 C-92 -22 -66 -44 -52 -78 C-36 -46 -14 -58 0 -150 Z"/>
      <path d="M0 -24 C20 4 44 18 44 52 C44 78 24 92 0 92 C-24 92 -44 78 -44 54 C-44 36 -30 26 -22 6 C-12 22 -4 12 0 -24 Z" stroke-width="6"/>
    </g>

    <!-- inseto (falha) -->
    <g transform="translate(1340 690) rotate(9)">
      <ellipse cx="0" cy="14" rx="58" ry="82"/>
      <circle cx="0" cy="-92" r="30"/>
      <path d="M0 -68 V96" stroke-width="6"/>
      <path d="M-58 -10 L-112 -40 M-58 30 L-120 36 M-52 70 L-104 108 M58 -10 L112 -40 M58 30 L120 36 M52 70 L104 108" stroke-width="6"/>
      <path d="M-14 -120 L-34 -158 M14 -120 L34 -158" stroke-width="6"/>
    </g>

    <!-- escudo trincado -->
    <g transform="translate(1350 200) rotate(8)">
      <path d="M0 -130 L108 -88 V12 C108 76 54 118 0 140 C-54 118 -108 76 -108 12 V-88 Z"/>
      <path d="M-6 -120 L18 -56 L-22 -14 L20 34 L-4 126" fill="none" stroke-width="7"/>
    </g>

    <!-- lupa -->
    <g transform="translate(250 690) rotate(-8)">
      <circle cx="-14" cy="-14" r="84"/>
      <path d="M46 46 L118 118" stroke-width="18"/>
      <path d="M-50 -30 H22 M-50 -4 H10 M-50 22 H22" stroke-width="6"/>
    </g>

    <!-- chave (correção) -->
    <g transform="translate(800 92) rotate(-4)">
      <path d="M-120 20 L40 -50" stroke-width="22"/>
      <circle cx="82" cy="-66" r="44"/>
      <path d="M70 -100 L100 -66" stroke-width="6"/>
    </g>
  </g>

  <g fill="#fff" fill-opacity="0.13">
    <circle cx="480" cy="120" r="6"/><circle cx="640" cy="760" r="6"/><circle cx="1010" cy="810" r="6"/>
    <circle cx="1120" cy="130" r="6"/><circle cx="90" cy="450" r="6"/><circle cx="1520" cy="450" r="6"/><circle cx="520" cy="470" r="5"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity="0.13" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round">
    <path d="M330 150 Q560 80 720 98"/><path d="M900 98 Q1100 70 1280 170"/><path d="M330 640 Q480 760 700 760"/>
    <path d="M1000 800 Q1180 790 1300 700"/><path d="M240 330 Q150 440 220 560"/><path d="M1380 340 Q1480 460 1400 590"/>
  </g>
</svg>
